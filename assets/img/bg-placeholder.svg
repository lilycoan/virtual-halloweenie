<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1950" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder background (original, Agent-made). Will be replaced by the Developer's AI painting.
       Coordinate frame matches the stage: 900 x 1950 (9:19.5). Lab facade strip centered at x=450. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140b26"/>
      <stop offset="0.55" stop-color="#2b1846"/>
      <stop offset="0.8" stop-color="#1d3a3a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9f7d2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9f7d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="labGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2f45"/>
      <stop offset="0.5" stop-color="#2f5670"/>
      <stop offset="1" stop-color="#1a2a3e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#0d0e14"/>
    </linearGradient>
    <radialGradient id="labHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ef2c9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5ef2c9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky + moon -->
  <rect width="900" height="1950" fill="url(#sky)"/>
  <circle cx="700" cy="260" r="220" fill="url(#moonGlow)"/>
  <circle cx="700" cy="260" r="78" fill="#e4f2c8"/>
  <circle cx="676" cy="240" r="14" fill="#cddcb0"/>
  <circle cx="724" cy="282" r="9" fill="#cddcb0"/>

  <!-- Far skyline (hazy) -->
  <g fill="#2a2140">
    <rect x="0" y="900" width="120" height="500"/>
    <rect x="100" y="820" width="90" height="580"/>
    <rect x="180" y="960" width="110" height="440"/>
    <rect x="610" y="940" width="100" height="460"/>
    <rect x="700" y="860" width="90" height="540"/>
    <rect x="780" y="980" width="120" height="420"/>
  </g>

  <!-- Lab halo + tower (focal point) -->
  <ellipse cx="450" cy="850" rx="360" ry="520" fill="url(#labHalo)"/>
  <!-- spire / beacon mount -->
  <rect x="438" y="380" width="24" height="110" fill="#9fb7c9"/>
  <!-- tower body: tapered -->
  <path d="M330 1330 L350 520 Q450 470 550 520 L570 1330 Z" fill="url(#labGlass)" stroke="#5ef2c9" stroke-width="5"/>
  <!-- side panels -->
  <path d="M350 520 L330 1330 L300 1330 L322 560 Z" fill="#dfe7ee"/>
  <path d="M550 520 L570 1330 L600 1330 L578 560 Z" fill="#c6d2dc"/>
  <!-- blank facade strip where warning lights sit (x≈450, y 640–1000) -->
  <rect x="412" y="600" width="76" height="460" rx="38" fill="#141f2e" stroke="#5ef2c9" stroke-opacity="0.5" stroke-width="3"/>
  <!-- window bands -->
  <g fill="#5ef2c9" opacity="0.35">
    <rect x="360" y="600" width="40" height="8"/><rect x="500" y="600" width="40" height="8"/>
    <rect x="358" y="720" width="42" height="8"/><rect x="500" y="720" width="42" height="8"/>
    <rect x="356" y="840" width="44" height="8"/><rect x="500" y="840" width="44" height="8"/>
    <rect x="354" y="960" width="46" height="8"/><rect x="500" y="960" width="46" height="8"/>
    <rect x="352" y="1080" width="48" height="8"/><rect x="500" y="1080" width="48" height="8"/>
  </g>
  <!-- base + doors + vents -->
  <rect x="280" y="1300" width="340" height="70" fill="#dfe7ee"/>
  <rect x="405" y="1180" width="90" height="150" rx="6" fill="#0b1520" stroke="#5ef2c9" stroke-width="4"/>
  <line x1="450" y1="1184" x2="450" y2="1326" stroke="#5ef2c9" stroke-width="3"/>
  <g fill="#0b1520" stroke="#7a8a98" stroke-width="3">
    <rect x="312" y="1240" width="60" height="40" rx="4"/>
    <rect x="528" y="1240" width="60" height="40" rx="4"/>
  </g>

  <!-- Near ruined skyscrapers framing left/right -->
  <g fill="#16121f">
    <path d="M0 520 L150 520 L150 560 L170 560 L170 1500 L0 1500 Z"/>
    <path d="M150 760 L250 740 L262 790 L270 1500 L150 1500 Z"/>
    <path d="M900 600 L760 600 L745 660 L730 650 L730 1500 L900 1500 Z"/>
    <path d="M730 820 L640 800 L630 860 L630 1500 L730 1500 Z"/>
  </g>
  <!-- broken windows (some faintly lit) -->
  <g fill="#3b3352">
    <rect x="30" y="600" width="30" height="40"/><rect x="90" y="600" width="30" height="40"/>
    <rect x="30" y="700" width="30" height="40"/><rect x="90" y="760" width="30" height="40"/>
    <rect x="30" y="880" width="30" height="40"/><rect x="90" y="980" width="30" height="40"/>
    <rect x="790" y="680" width="30" height="40"/><rect x="840" y="680" width="30" height="40"/>
    <rect x="790" y="800" width="30" height="40"/><rect x="840" y="900" width="30" height="40"/>
    <rect x="790" y="1020" width="30" height="40"/><rect x="660" y="900" width="26" height="36"/>
  </g>
  <g fill="#8fd16a" opacity="0.4">
    <rect x="90" y="700" width="30" height="40"/><rect x="840" y="800" width="30" height="40"/>
  </g>

  <!-- Street: road in perspective toward the lab -->
  <path d="M0 1500 L330 1370 L570 1370 L900 1500 L900 1950 L0 1950 Z" fill="url(#road)"/>
  <path d="M0 1500 L330 1370 L280 1370 L0 1460 Z" fill="#2d2a38"/>
  <path d="M900 1500 L570 1370 L620 1370 L900 1460 Z" fill="#2d2a38"/>
  <!-- center dashes -->
  <g fill="#c9b85a" opacity="0.6">
    <path d="M446 1390 L454 1390 L456 1420 L444 1420 Z"/>
    <path d="M443 1460 L457 1460 L460 1510 L440 1510 Z"/>
    <path d="M438 1580 L462 1580 L467 1660 L433 1660 Z"/>
    <path d="M430 1760 L470 1760 L478 1880 L422 1880 Z"/>
  </g>
  <!-- cracks + weeds -->
  <g stroke="#06070b" stroke-width="4" fill="none">
    <path d="M120 1700 L200 1660 L230 1700 L300 1690"/>
    <path d="M620 1820 L680 1760 L760 1780"/>
  </g>
  <g fill="#2f5a3a">
    <path d="M200 1660 q6 -30 12 0 q6 -24 12 0 z"/>
    <path d="M680 1760 q6 -30 12 0 q6 -24 12 0 z"/>
    <path d="M40 1520 q8 -40 16 0 q8 -32 16 0 z"/>
  </g>
</svg>
